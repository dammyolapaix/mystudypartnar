services:
  db:
    image: postgres:17
    container_name: mystudypartnar
    hostname: localhost
    environment:
      - POSTGRES_PASSWORD=mystudypartnar
      - POSTGRES_USER=mystudypartnar
      - POSTGRES_DB=mystudypartnar
    ports:
      - 5432:5432
    volumes:
      - mystudypartnar_data:/var/lib/postgresql/data
volumes:
  mystudypartnar_data:
