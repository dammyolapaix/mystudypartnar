services:
  db:
    image: pgvector/pgvector:pg17
    container_name: mystudypartnar
    hostname: localhost
    environment:
      - POSTGRES_PASSWORD=mystudypartnar
      - POSTGRES_USER=mystudypartnar
      - POSTGRES_DB=mystudypartnar
    ports:
      - 5432:5432
    volumes:
      - mystudypartnar_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-vector.sql:ro
volumes:
  mystudypartnar_data:
